<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>viz test</title>
<body style="font:14px system-ui;margin:8px">
<p id="s">idle</p><button id="go">run</button> <select id="mode"><option>styled</option><option>exact</option></select> <input id="style" value="כפרי" size="12">
<div style="display:flex;gap:6px"><img id="a" style="width:38%"><img id="b" style="width:60%"></div>
<script>
const s=document.getElementById('s');
const b64=async(u,max,bg)=>{const im=new Image();im.src=u;await im.decode();const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=im.naturalWidth*k;c.height=im.naturalHeight*k;const x=c.getContext('2d');if(bg){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.9).split(',')[1]};
document.getElementById('go').onclick=async()=>{
  s.textContent='preparing';document.getElementById('a').src='composite-30.jpg';
  const R=[['oak dining table','../f-oak-sun.webp'],['Byron dining chair with rattan back and cream seat','../f-byron-q-sun.webp'],['rustic wooden drinks bar','../f-bar-sun.webp'],['cream modular sofa','../f-sofa-sun.webp'],['Milano high bar table with two bar chairs','../f-hibar-sun.webp']];
  const body={mode:document.getElementById('mode').value,composite:await b64('composite-30.jpg',1280),mime:'image/jpeg',place:await b64('../before.jpg',1600),place_mime:'image/jpeg',
    refs:await Promise.all(R.map(async([name,u])=>({name,mime:'image/jpeg',data:await b64(u,640,1)}))),items:'4 oak dining tables, 30 Byron dining chairs, 1 rustic drinks bar, 1 cream sofa, 1 high bar table with 2 bar chairs',style:document.getElementById('style').value,hints:{place:'lawn in front of a villa',shadow:'right'}};
  s.textContent='waiting';const t=Date.now();
  try{const r=await fetch('https://kizbawgcjjyhyvwvudgg.supabase.co/functions/v1/visualize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();
    s.textContent='status '+r.status+' '+(d.error||d.provider)+' '+(d.model||'')+' '+Math.round((Date.now()-t)/1000)+'s '+(d.image?Math.round(d.image.length/1024)+'KB '+d.mime:'');
    if(d.image)document.getElementById('b').src='data:'+d.mime+';base64,'+d.image}catch(e){s.textContent='error '+e}};
</script>
