<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>viz test</title>
<body style="font:14px system-ui;margin:8px">
<p id="s">idle</p><button id="go">run</button> <select id="pic"><option>composite-30</option><option>composite-60-cloth</option></select>
<div style="display:flex;gap:6px"><img id="a" style="width:49%"><img id="b" style="width:49%"></div>
<script>
const s=document.getElementById('s');
document.getElementById('go').onclick=async()=>{
  const n=document.getElementById('pic').value,blob=await (await fetch(n+'.jpg')).blob();
  const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});
  document.getElementById('a').src=n+'.jpg';s.textContent='waiting';const t=Date.now();
  try{const r=await fetch('https://kizbawgcjjyhyvwvudgg.supabase.co/functions/v1/visualize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({composite:b64,mime:'image/jpeg',hints:{place:'lawn in front of a villa',shadow:'right'}})}),d=await r.json();
    s.textContent='status '+r.status+' '+(d.error||d.provider)+' '+Math.round((Date.now()-t)/1000)+'s '+(d.image?Math.round(d.image.length/1024)+'KB '+d.mime:'');
    if(d.image)document.getElementById('b').src='data:'+d.mime+';base64,'+d.image}catch(e){s.textContent='error '+e}};
</script>
