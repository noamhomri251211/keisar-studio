<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>קיסר סטודיו · ניהול</title>
<style>
:root{--ink:#1f1f1f;--mute:#77736c;--paper:#fff;--stage:#f3f0ea;--line:#e6e1d8;--accent:#b08d66;--ok:#1d7a52;--bad:#b3261e;--font:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 14px}h2{font-size:17px;margin:26px 0 10px}
.card{background:var(--paper);border-radius:18px;padding:16px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:99px;padding:10px 18px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;min-height:44px}
button.q{background:var(--stage);color:var(--ink)}button[disabled]{opacity:.5}
input,select{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:44px;max-width:100%}
.tabs{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}.tabs button[aria-pressed=true]{background:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--paper);border-radius:18px;padding:14px}.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.kpi span{color:var(--mute);font-size:13px}
.bar{display:grid;grid-template-columns:120px 1fr 56px;gap:10px;align-items:center;margin:8px 0}.bar i{display:block;height:14px;border-radius:99px;background:var(--accent);min-width:2px}.bar em{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums;text-align:end}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:start;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:600;font-size:13px}
td input[type=number]{width:96px}td input[type=text]{width:100%;min-width:180px}
.msg{min-height:22px;color:var(--mute);margin:8px 0}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
small{color:var(--mute)}

/* polish pass */
.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tabs button{white-space:nowrap;flex:none;padding:10px 16px}
#gate{max-width:420px}
#msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;width:max-content;max-width:calc(100vw - 32px);margin:0;padding:12px 18px;border-radius:14px;background:var(--ink);color:#fff;font-weight:600;text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.45)}#msg:empty{display:none}#msg.bad{background:var(--bad);color:#fff}#msg.ok{background:var(--ok);color:#fff}
.ord{padding:0;overflow:hidden;border-inline-start:4px solid transparent}.ord.new{border-inline-start-color:var(--accent)}
.ord header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px 10px}.ord header b{font-size:17px;margin-inline-end:8px}.ord header select{min-height:40px;padding:6px 10px;font-size:15px}
.og{display:flex;gap:14px;padding:0 16px 12px;align-items:flex-start}.oi{flex:none;width:132px}.oi img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--stage)}.ob{flex:1;min-width:0}
.ord p{margin:0 0 10px}.ord .nt{background:#f6efe4;border-radius:12px;padding:10px 12px}.ord .nt small{display:block;font-weight:600;color:#8a6a45}
.ord ul{list-style:none;margin:0;padding:0}.ord li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}.ord li b{white-space:nowrap;font-variant-numeric:tabular-nums}
.ord footer{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 16px;background:#faf8f4;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}.ct{display:flex;gap:6px}.ct a{display:inline-grid;place-items:center;min-height:40px;padding:0 14px;border-radius:99px;background:var(--ink);color:#fff;font-weight:600;text-decoration:none}.ct a+a{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.tg{display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}.tg input{min-height:0;width:22px;height:22px;accent-color:var(--accent)}
.fl{display:inline-block;margin-top:4px;font-size:12.5px;color:var(--mute);text-decoration:underline;cursor:pointer}
.fbtn{display:inline-flex;align-items:center;min-height:44px;max-width:100%;padding:0 16px;border-radius:12px;border:1.5px dashed var(--accent);color:#8a6a45;font-weight:600;cursor:pointer}.fbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:721px){.cat .tg span{display:none}}
@media(max-width:720px){
 .og{flex-direction:column}.oi{width:100%}.oi img{aspect-ratio:16/10}
 .cat{min-width:0}.cat thead{display:none}.cat,.cat tbody{display:block}.cat tr{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 12px;padding:14px 0;border-bottom:1px solid var(--line)}.cat td{display:block;border:0;padding:0;grid-column:2}.cat td:first-child{grid-column:1;grid-row:1/span 5}.cat td input[type=text]{min-width:0}.cat td input[type=number]{width:31%!important}
 .bar{grid-template-columns:104px 1fr 52px}
}
</style>
</head>
<body>
<main>
<h1>קיסר סטודיו · ניהול</h1>
<div id="gate" class="card">
  <p style="margin-top:0">נכנסים עם קוד הניהול.</p>
  <form onsubmit="enter(event)" style="display:flex;gap:8px;flex-wrap:wrap">
    <input id="code" type="password" autocomplete="off" aria-label="קוד ניהול" placeholder="קוד ניהול">
    <button>כניסה</button>
  </form>
  <p id="gmsg" class="msg" role="status"></p>
</div>
<div id="app" hidden>
  <div class="tabs">
    <button aria-pressed="true" onclick="show('stats',this)">מבט על</button>
    <button class="q" aria-pressed="false" onclick="show('orders',this)">מפרטים</button>
    <button class="q" aria-pressed="false" onclick="show('catalog',this)">קטלוג</button>
    <button class="q" aria-pressed="false" onclick="show('costs',this)">עלויות</button>
  </div>
  <p id="msg" class="msg" role="status"></p>
  <section id="stats"></section>
  <section id="orders" hidden></section>
  <section id="catalog" hidden></section>
  <section id="costs" hidden></section>
</div>
</main>
<script>
// The admin code is kept only in this page's memory: closing or reloading the tab signs out.
const API='https://kizbawgcjjyhyvwvudgg.supabase.co/functions/v1/admin';let CODE='';
const $=id=>document.getElementById(id),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nis=n=>'₪'+Math.round(n||0).toLocaleString('he-IL');
let sayT=0;const say=(t,k)=>{const m=$('msg');m.textContent=t||'';m.className='msg'+(k?' '+k:'');clearTimeout(sayT);if(t&&k)sayT=setTimeout(()=>{m.textContent=''},k==='ok'?3500:7000)};
async function call(action,body){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-admin-code':CODE},body:JSON.stringify({action,...body})});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'server'),{status:r.status});return d;
}
const why=e=>e.status===401?'הקוד שגוי.':e.status===429?'יותר מדי ניסיונות. נסו שוב בעוד שעה.':e.status===503?'הניהול עוד לא הופעל: חסר קוד ניהול בשרת.':e.status?'השרת לא הצליח. נסו שוב.':'אין חיבור. נסו שוב.';
async function enter(ev){ev.preventDefault();CODE=$('code').value;$('gmsg').textContent='בודקים…';
  try{const d=await call('stats',{days:30});$('code').value='';try{window.NAMES=Object.fromEntries((await call('products')).products.map(p=>[p.id,p.name]))}catch(e){}$('gate').hidden=true;$('app').hidden=false;drawStats(d.stats)}
  catch(e){CODE='';$('gmsg').textContent=why(e);$('gmsg').className='msg bad'}}
function show(id,btn){for(const s of['stats','orders','catalog','costs'])$(s).hidden=s!==id;
  for(const b of document.querySelectorAll('.tabs button')){const on=b===btn;b.setAttribute('aria-pressed',on);b.className=on?'':'q'}
  say('טוען…');({stats:loadStats,orders:loadOrders,catalog:loadCatalog,costs:loadCosts})[id]().then(()=>say('')).catch(e=>say(why(e),'bad'))}
const SCREENS=[['screen_join','פתחו הרשמה'],['screen_photo','נרשמו והגיעו לצילום'],['screen_guests','בחרו מספר אורחים'],['screen_result','ראו את המקום מרוהט'],['screen_checkout','פתחו את המפרט'],['screen_done','שלחו לנציג']];
async function loadStats(){drawStats((await call('stats',{days:+($('days')?.value||30)})).stats)}
function drawStats(s){const f=s.funnel||{},top=Math.max(1,...SCREENS.map(([k])=>f[k]||0)),NAMES=window.NAMES||{};
  $('stats').innerHTML=`<div style="margin-bottom:12px"><label>תקופה <select id="days" onchange="show('stats',document.querySelector('.tabs button'))">${[7,30,90].map(d=>`<option value="${d}" ${s.days==d?'selected':''}>${d} ימים אחרונים</option>`).join('')}</select></label></div>
  <div class="kpis"><div class="kpi"><b>${s.sessions}</b><span>ביקורים</span></div><div class="kpi"><b>${s.joins}</b><span>הרשמות</span></div><div class="kpi"><b>${s.orders}</b><span>מפרטים שנשלחו</span></div><div class="kpi"><b>${s.sessions?Math.round(100*s.orders/s.sessions):0}%</b><span>מביקור למפרט</span></div><div class="kpi"><b>${s.realistic}</b><span>תמונות מציאותיות</span></div></div>
  <h2>איפה נושרים בדרך</h2><div class="card">${SCREENS.map(([k,n])=>`<div class="bar"><span>${n}</span><i style="width:${100*(f[k]||0)/top}%"></i><em>${f[k]||0}</em></div>`).join('')}</div>
  <h2>המוצרים שנבחרו הכי הרבה</h2><div class="card">${(s.top||[]).length?s.top.map(t=>`<div class="bar"><span>${esc(NAMES[t.id]||t.id)}</span><i style="width:${100*t.n/s.top[0].n}%"></i><em>${t.n}</em></div>`).join(''):'<small>עוד לא נשלחו מפרטים בתקופה הזאת.</small>'}</div>
  <h2>מפרטים לפי יום</h2><div class="card">${(s.by_day||[]).length?s.by_day.map(d=>`<div class="bar"><span>${esc(d.d)}</span><i style="width:${100*d.n/Math.max(...s.by_day.map(x=>x.n))}%"></i><em>${d.n}</em></div>`).join(''):'<small>עוד לא נשלחו מפרטים בתקופה הזאת.</small>'}</div>`}
const ST={new:'חדש, מחכה להצעה',confirmed:'נשלחה הצעת מחיר',paid:'נסגר',cancelled:'בוטל'},AREA={sharon:'השרון וקיסריה',center:'גוש דן והמרכז',jlm:'ירושלים והסביבה',far:'צפון / דרום'},COL={sand:'חול',sage:'ירוק מרווה',blue:'כחול',pink:'ורוד עתיק',black:'שחור'};
async function loadOrders(){const{orders}=await call('orders');
  const when=t=>new Date(t).toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}),day=d=>{const[y,m,x]=String(d||'').split('-');return x?`${+x}.${+m}.${y}`:''},wa=p=>{const n=String(p||'').replace(/\D/g,'');return n?'https://wa.me/'+(n.startsWith('0')?'972'+n.slice(1):n):''};
  $('orders').innerHTML=orders.length?`<p><small>${orders.filter(o=>o.status==='new').length} מפרטים מחכים להצעת מחיר.</small></p>`+orders.map(o=>`<article class="card ord${o.status==='new'?' new':''}">
   <header><div><b>${esc(o.no)}</b><small>התקבל ${when(o.created_at)}</small></div><select aria-label="מצב מפרט ${esc(o.no)}" onchange="setStatus('${o.id}',this);this.closest('.ord').classList.toggle('new',this.value==='new')">${Object.entries(ST).map(([k,n])=>`<option value="${k}" ${o.status===k?'selected':''}>${n}</option>`).join('')}</select></header>
   <div class="og">${o.picture?`<a class="oi" href="${esc(o.picture)}" target="_blank" rel="noopener" aria-label="ההדמיה שהלקוח ראה, בגודל מלא"><img src="${esc(o.picture)}" alt="" loading="lazy"></a>`:''}
   <div class="ob"><p class="ev"><b>${esc(day(o.event_date))}</b> · ${o.guests} אורחים${o.style?' · '+esc(o.style):''}<br><small>${esc(o.address)} · ${esc(AREA[o.area]||o.area)}</small></p>
   ${o.note?`<p class="nt"><small>בקשת הלקוח</small>${esc(o.note)}</p>`:''}
   <ul>${o.lines.map(l=>`<li><span>${esc(l.name)}${l.color&&COL[l.color]?' · '+COL[l.color]:''}</span><b>× ${esc(l.q)}</b></li>`).join('')}</ul></div></div>
   <footer><span><bdi>${esc(o.email)}</bdi> · <bdi>${esc(o.phone)}</bdi></span><span class="ct">${o.phone?`<a href="tel:${esc(o.phone)}">להתקשר</a>${wa(o.phone)?`<a href="${wa(o.phone)}" target="_blank" rel="noopener">וואטסאפ</a>`:''}`:''}${o.email?`<a href="mailto:${esc(o.email)}?subject=${encodeURIComponent('הצעת מחיר · בקשה '+o.no)}">מייל</a>`:''}</span></footer></article>`).join(''):'<div class="card"><small>עוד לא נשלחו מפרטים.</small></div>'}
async function setStatus(id,el){el.disabled=true;try{await call('order_status',{id,status:el.value});say('המצב עודכן.','ok')}catch(e){say(why(e),'bad')}el.disabled=false}
const KIND={chair:'כיסא',table:'שולחן',extra:'תוספת (לאונג׳, בר וכו׳)',addon:'שירות'};
const pic=p=>p.image_url||(p.sprite_key?`f-${p.sprite_key}${p.kind==='chair'&&!/-q$/.test(p.sprite_key)?'-q':''}-sun.webp`:'');
// shrink a chosen photo in the browser before it is sent: at most 1000 px, JPEG
async function shrink(file){const u=URL.createObjectURL(file),im=new Image();im.src=u;await im.decode();const k=Math.min(1,1000/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return c.toDataURL('image/jpeg',.88).split(',')[1]}
const num=v=>v===''||v==null?null:+v;
async function loadCatalog(){const{products}=await call('products');window.NAMES=Object.fromEntries(products.map(p=>[p.id,p.name]));
  $('catalog').innerHTML=`<div class="card"><h2 style="margin-top:0">מוצר חדש</h2>
   <p><small>שם, סוג, תמונה ומידות. המוצר מופיע ללקוחות בכניסה הבאה לאפליקציה, וההדמיה משתמשת בתמונה שתעלו. תמונה על רקע לבן ונקי נותנת את התוצאה הטובה ביותר.</small></p>
   <form id="np" onsubmit="addProduct(event)" style="display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
    <label>שם<br><input type="text" name="name" required maxlength="80"></label>
    <label>סוג<br><select name="kind"><option value="chair">כיסא</option><option value="table">שולחן (8 סועדים)</option><option value="extra" selected>תוספת</option></select></label>
    <label>תיאור קצר<br><input type="text" name="description" maxlength="200"></label>
    <label>רוחב (מ׳)<br><input type="number" name="width_m" min="0.05" max="20" step="0.01"></label>
    <label>עומק (מ׳)<br><input type="number" name="depth_m" min="0.05" max="20" step="0.01"></label>
    <label>גובה (מ׳)<br><input type="number" name="height_m" min="0.05" max="20" step="0.01"></label>
    <div>תמונה<br><label class="fbtn"><span>בחירת תמונה</span><input type="file" name="image" accept="image/*" hidden onchange="this.previousElementSibling.textContent=this.files[0]?this.files[0].name:'בחירת תמונה'"></label></div>
    <div style="align-self:end"><button>להוסיף לקטלוג</button></div></form></div>
  <p><small>שינוי בשורה נשמר בלחיצה על "שמירה". מוצר כבוי לא מוצג ללקוחות. מוצרים שנוספו כאן אפשר גם למחוק; את מוצרי הבסיס מכבים.</small></p>
  <div class="card tw"><table class="cat"><thead><tr><th>תמונה</th><th>מוצר</th><th>תיאור</th><th>מידות במטרים (ר / ע / ג)</th><th>מוצג</th><th></th></tr></thead><tbody>${products.filter(p=>p.kind!=='addon').map(p=>`<tr data-id="${esc(p.id)}">
   <td>${pic(p)?`<img src="${esc(pic(p))}" alt="" onerror="this.style.visibility='hidden'" style="width:64px;height:64px;object-fit:contain;border-radius:10px;background:var(--stage)">`:''}<br><label class="fl">החלפת תמונה<input type="file" accept="image/*" data-img hidden onchange="this.parentNode.firstChild.textContent=this.files[0]?'נבחרה, לחצו שמירה':'החלפת תמונה'"></label></td>
   <td><input type="text" data-f="name" aria-label="שם" value="${esc(p.name)}"><br><small>${KIND[p.kind]||''}</small></td>
   <td><input type="text" data-f="description" aria-label="תיאור" value="${esc(p.description)}"></td>
   <td style="white-space:nowrap">${[['width_m','רוחב'],['depth_m','עומק'],['height_m','גובה']].map(([k,n])=>`<input type="number" data-f="${k}" aria-label="${n} במטרים" placeholder="${n}" min="0.05" max="20" step="0.01" value="${p[k]??''}" style="width:78px">`).join(' ')}</td>
   <td><label class="tg"><input type="checkbox" data-f="active" ${p.active?'checked':''}><span>מוצג ללקוחות</span></label></td>
   <td style="white-space:nowrap"><button class="q" onclick="saveRow(this)">שמירה</button>${/^c-/.test(p.id)?` <button class="q" onclick="delRow(this)" style="color:var(--bad)">מחיקה</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
const oops=e=>({name:'חסר שם למוצר.',size:'מידה לא תקינה: בין 0.05 ל-20 מטר.',image:'התמונה לא התקבלה. נסו קובץ אחר, עד 2MB.',kind:'חסר סוג מוצר.',builtin:'מוצר בסיס לא נמחק, רק מכבים אותו.'}[e.message]||why(e));
async function addProduct(ev){ev.preventDefault();const f=ev.target,btn=f.querySelector('button'),file=f.image.files[0];if(!file){say('חסרה תמונה למוצר. לחצו על בחירת תמונה.','bad');return}btn.disabled=true;say('מעלה…');
  try{const image=await shrink(file);await call('product_create',{fields:{name:f.name.value,kind:f.kind.value,description:f.description.value,width_m:num(f.width_m.value),depth_m:num(f.depth_m.value),height_m:num(f.height_m.value)},image,image_mime:'image/jpeg'});await loadCatalog();say('המוצר נוסף לקטלוג.','ok')}
  catch(e){say(oops(e),'bad')}btn.disabled=false}
async function saveRow(btn){const tr=btn.closest('tr'),fields={};for(const i of tr.querySelectorAll('[data-f]'))fields[i.dataset.f]=i.type==='checkbox'?i.checked:i.type==='number'?num(i.value):i.value;
  btn.disabled=true;try{const file=tr.querySelector('[data-img]').files[0],extra=file?{image:await shrink(file),image_mime:'image/jpeg'}:{};await call('product_update',{id:tr.dataset.id,fields,...extra});if(file)await loadCatalog();say('נשמר: '+fields.name,'ok')}catch(e){say(oops(e),'bad')}btn.disabled=false}
async function delRow(btn){const tr=btn.closest('tr');if(btn.dataset.sure!=='1'){btn.dataset.sure='1';btn.textContent='בטוח? לחצו שוב';setTimeout(()=>{btn.dataset.sure='';btn.textContent='מחיקה'},4000);return}
  btn.disabled=true;try{await call('product_delete',{id:tr.dataset.id});tr.remove();say('המוצר נמחק.','ok')}catch(e){say(oops(e),'bad');btn.disabled=false}}
// ---- what the AI services cost
async function loadCosts(){const d=+($('cdays')?.value||30),img=+($('cimg')?.value||0.41),chat=+($('cchat')?.value||0.03);drawCosts((await call('costs',{days:d,image_ils:img,chat_ils:chat})).costs)}
const ils=n=>'₪'+(+n||0).toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2});
function drawCosts(c){const per=(a,b)=>b?ils(a/b):'אין נתונים',top=Math.max(.01,...c.by_day.map(x=>+x.ils));
  $('costs').innerHTML=`<div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
   <label>תקופה<br><select id="cdays">${[7,30,90].map(d=>`<option value="${d}" ${c.days==d?'selected':''}>${d} ימים</option>`).join('')}</select></label>
   <label>עלות להדמיה (₪)<br><input id="cimg" type="number" min="0.01" max="99" step="0.01" value="${c.image_ils}" style="width:110px"></label>
   <label>עלות לשיחת התאמה (₪)<br><input id="cchat" type="number" min="0.001" max="99" step="0.001" value="${c.chat_ils}" style="width:110px"></label>
   <button class="q" onclick="show('costs',document.querySelectorAll('.tabs button')[3])">לחשב</button></div>
  <p><small>החישוב הוא הערכה: מספר ההדמיות והשיחות שנעשו בפועל, כפול העלות ליחידה שמופיעה למעלה (אפשר לעדכן אותה לפי החשבון מגוגל). החיוב המדויק מופיע בחשבון Google.</small></p>
  <div class="kpis"><div class="kpi"><b>${ils(c.total_ils)}</b><span>סך הכול בתקופה</span></div><div class="kpi"><b>${c.images}</b><span>הדמיות</span></div><div class="kpi"><b>${c.chats}</b><span>שיחות התאמה</span></div><div class="kpi"><b>${per(c.total_ils,c.customers)}</b><span>ממוצע ללקוח רשום (${c.customers})</span></div><div class="kpi"><b>${per(c.total_ils,c.specs)}</b><span>עלות למפרט שנשלח (${c.specs})</span></div><div class="kpi"><b>${per(c.total_ils,c.by_day.length)}</b><span>ממוצע ליום פעיל</span></div></div>
  <h2>לפי יום</h2><div class="card">${c.by_day.length?c.by_day.map(x=>`<div class="bar"><span>${esc(x.d)}</span><i style="width:${100*x.ils/top}%"></i><em>${ils(x.ils)}</em></div><small style="display:block;margin:-4px 130px 8px 0">${x.images} הדמיות · ${x.chats} שיחות</small>`).join(''):'<small>אין שימוש בתקופה הזאת.</small>'}</div>
  <h2>לפי לקוח</h2><div class="card tw">${c.by_customer.length?`<table style="min-width:0"><thead><tr><th>לקוח</th><th>הדמיות</th><th>שיחות</th><th>עלות</th></tr></thead><tbody>${c.by_customer.map(x=>`<tr><td><bdi>${esc(x.who)}</bdi></td><td>${x.images}</td><td>${x.chats||0}</td><td>${ils(x.ils)}</td></tr>`).join('')}</tbody></table>`:'<small>אין שימוש בתקופה הזאת.</small>'}</div>`}
</script>
</body>
</html>
